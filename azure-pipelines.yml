name: Deploy/Destroy IaC

parameters:
- name: action
  displayName: 'IaC Action'
  type: string
  default: apply
  values:
  - apply
  - destroy

pr:
  branches:
    include:
    - main

trigger: none

variables:
- group: WildCard-Infra-Variables

jobs:
- job: deploy_or_destroy
  displayName: 'Deploy or Destroy IaC'
  pool:
    vmImage: ubuntu-22.04
  steps:
  - checkout: self
    persistCredentials: true

  # SECTION - Echo variables
  - script: |
      echo "================= VARIABLES ================="
      echo "Action: ${{ parameters.action }}"
      echo "Service Connection: $(SERVICE_CONNECTION)"
      echo "Terraform Resource Group: $(TF_RG)"
      echo "Terraform Storage Account: $(TF_STA)"
      echo "Terraform Container: $(TF_CONTAINER)"
      echo "Terraform State Key: $(TF_STATE_KEY)"
      echo "Working Directory: $(Build.SourcesDirectory)/infrastructure"
      echo "============================================"
    displayName: 'Echo Pipeline Variables'

  # SECTION - Terraform CLI installation
  - task: TerraformInstaller@1
    displayName: 'Install Terraform CLI'
    inputs:
      terraformVersion: 'latest'

  # SECTION - Terraform Init
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      backendServiceArm: $(SERVICE_CONNECTION)
      backendAzureRmResourceGroupName: $(TF_RG)
      backendAzureRmStorageAccountName: $(TF_STA)
      backendAzureRmContainerName: $(TF_CONTAINER)
      backendAzureRmKey: $(TF_STATE_KEY)
      allowTelemetryCollection: false

  # ====================================================
  # SECTION - Terraform Import Existing RG
  # ====================================================
  - task: Bash@3
    displayName: 'Terraform Import Existing Resource Group'
    inputs:
      targetType: 'inline'
      script: |
        echo "Checking if RG is already imported..."
        # Check if resource group already exists in Terraform state
        terraform -chdir=$(Build.SourcesDirectory)/infrastructure state list | grep module.rg.azurerm_resource_group.resource_group > /dev/null 2>&1
        if [ $? -ne 0 ]; then
          echo "Importing existing resource group into Terraform state..."
          terraform -chdir=$(Build.SourcesDirectory)/infrastructure import module.rg.azurerm_resource_group.resource_group /subscriptions/d684986e-9ad3-4d0a-a267-cb448ffd6845/resourceGroups/rg-wc-weu
        else
          echo "Resource group already imported, skipping..."
        fi

  # SECTION - Terraform Format
  - task: Bash@3
    displayName: 'Terraform Format'
    inputs:
      targetType: 'inline'
      script: |
        terraform -chdir=$(Build.SourcesDirectory)/infrastructure fmt -recursive -diff

  # SECTION - Terraform Validate
  - task: TerraformTaskV4@4
    displayName: 'Terraform Validate'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

  # SECTION - Terraform Plan
  - task: TerraformTaskV4@4
    displayName: 'Terraform Plan'
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

  # SECTION - Terraform Apply
  - task: TerraformTaskV4@4
    displayName: 'Terraform Apply'
    condition: eq('${{ parameters.action }}', 'apply')
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
      commandOptions: '-auto-approve'

  # SECTION - Terraform Destroy
  - task: TerraformTaskV4@4
    displayName: 'Terraform Destroy'
    condition: eq('${{ parameters.action }}', 'destroy')
    inputs:
      provider: 'azurerm'
      command: 'destroy'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
      commandOptions: '-auto-approve'
