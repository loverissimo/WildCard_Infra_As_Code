name: Deploy/Destroy IaC

parameters:
- name: action
  displayName: 'IaC Action'
  type: string
  default: apply
  values:
  - apply
  - destroy

- name: target
  displayName: 'Target module/resource (optional)'
  type: string
  default: ' '

pr:
  branches:
    include:
    - main

trigger: none

variables:
- group: WildCard-Infra-Variables

jobs:
- job: deploy_or_destroy
  displayName: 'Deploy or Destroy IaC'
  pool:
    vmImage: ubuntu-22.04
  steps:
  - checkout: self
    persistCredentials: true

  # ---------------------------------------------------
  # Echo pipeline variables
  # ---------------------------------------------------
  - script: |
      echo "================= VARIABLES ================="
      echo "Action: ${{ parameters.action }}"
      echo "Service Connection: $(SERVICE_CONNECTION)"
      echo "Terraform Resource Group: $(TF_RG)"
      echo "Terraform Storage Account: $(TF_STA)"
      echo "Terraform Container: $(TF_CONTAINER)"
      echo "Terraform State Key: $(TF_STATE_KEY)"
      echo "Working Directory: $(Build.SourcesDirectory)/infrastructure"
      echo "============================================"
    displayName: 'Echo Pipeline Variables'

  # ---------------------------------------------------
  # Install Terraform CLI
  # ---------------------------------------------------
  - task: TerraformInstaller@1
    displayName: 'Install Terraform CLI'
    inputs:
      terraformVersion: 'latest'

  # ---------------------------------------------------
  # Terraform Init
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      backendServiceArm: $(SERVICE_CONNECTION)
      backendAzureRmResourceGroupName: $(TF_RG)
      backendAzureRmStorageAccountName: $(TF_STA)
      backendAzureRmContainerName: $(TF_CONTAINER)
      backendAzureRmKey: $(TF_STATE_KEY)

  # ---------------------------------------------------
  # Terraform Format
  # ---------------------------------------------------
  - task: Bash@3
    displayName: 'Terraform Format'
    inputs:
      targetType: 'inline'
      script: |
        terraform -chdir=$(Build.SourcesDirectory)/infrastructure fmt -recursive -diff

  # ---------------------------------------------------
  # Terraform Validate
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Validate'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

  # ---------------------------------------------------
  # Terraform Plan
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Plan'
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

# ---------------------------------------------------
# Terraform Apply
# ---------------------------------------------------
  - task: Bash@3
    displayName: 'Terraform Apply'
    condition: eq('${{ parameters.action }}', 'apply')
    inputs:
     targetType: 'inline'
     script: |
      set -e
      cd $(Build.SourcesDirectory)/infrastructure

      if [ -n "${{ parameters.target }}" ]; then
        echo "Applying only target: ${{ parameters.target }}"
        terraform apply -auto-approve -target=${{ parameters.target }}
      else
        echo "Applying all resources"
        terraform apply -auto-approve
      fi

# ---------------------------------------------------
# Terraform Destroy
# ---------------------------------------------------
  - task: Bash@3
    displayName: 'Terraform Destroy'
    condition: eq('${{ parameters.action }}', 'destroy')
    inputs:
     targetType: 'inline'
     script: |
      set -e
      cd $(Build.SourcesDirectory)/infrastructure

      if [ -n "${{ parameters.target }}" ]; then
        echo "Destroying only target: ${{ parameters.target }}"
        terraform destroy -auto-approve -target=${{ parameters.target }}
      else
        echo "Destroying all resources"
        terraform destroy -auto-approve
      fi