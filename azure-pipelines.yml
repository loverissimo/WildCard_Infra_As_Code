trigger:
- dev

parameters:
- name: environment
  type: string
  default: dev
  values:
    - dev
    - prod

variables:
  PULUMI_STACK: ${{ parameters.environment }}

stages:

# =========================================================
# SETUP
# =========================================================
- stage: Setup
  jobs:
  - job: install
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: "20.x"

    - script: |
        curl -fsSL https://get.pulumi.com | sh
        export PATH=$PATH:$HOME/.pulumi/bin
      displayName: Install Pulumi

    - script: |
        curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
      displayName: Install Infracost


# =========================================================
# PLAN
# =========================================================
- stage: Plan
  dependsOn: Setup
  jobs:
  - job: preview
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: |
        export PATH=$PATH:$HOME/.pulumi/bin

        pulumi login
        pulumi stack select $PULUMI_STACK

        pulumi preview --diff --json > preview.json
      displayName: Pulumi Preview

    - script: |
        infracost breakdown --path preview.json
      displayName: Cost Estimate


# =========================================================
# APPLY
# =========================================================
- stage: Apply
  dependsOn: Plan

  jobs:
  - deployment: pulumi_apply
    displayName: "Manual Apply"
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              export PATH=$PATH:$HOME/.pulumi/bin

              pulumi stack select $PULUMI_STACK
              pulumi up --yes
            displayName: Pulumi Up