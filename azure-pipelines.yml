name: Deploy/Destroy IaC

parameters:
- name: action
  displayName: 'IaC Action'
  type: string
  default: apply
  values:
  - apply
  - destroy

- name: useVnet
  displayName: 'VNet'
  type: boolean
  default: false

- name: useACR
  displayName: 'ACR'
  type: boolean
  default: false

pr:
  branches:
    include:
    - main

trigger: none

variables:
- group: WildCard-Infra-Variables

jobs:
- job: deploy_or_destroy
  displayName: 'Terraform IaC'
  pool:
    vmImage: ubuntu-22.04

  steps:
  - checkout: self
    persistCredentials: true

  # ---------------------------------------------------
  # Echo pipeline variables
  # ---------------------------------------------------
  - script: |
      echo "================= VARIABLES ================="
      echo "Action: ${{ parameters.action }}"
      echo "Selected VNet: ${{ parameters.useVnet }}"
      echo "Selected ACR: ${{ parameters.useACR }}"
      echo "Service Connection: $(SERVICE_CONNECTION)"
      echo "Terraform Resource Group: $(TF_RG)"
      echo "Terraform Storage Account: $(TF_STA)"
      echo "Terraform Container: $(TF_CONTAINER)"
      echo "Terraform State Key: $(TF_STATE_KEY)"
      echo "Working Directory: $(Build.SourcesDirectory)/infrastructure"
      echo "============================================"
    displayName: 'Echo Pipeline Variables'

  # ---------------------------------------------------
  # Install Terraform CLI
  # ---------------------------------------------------
  - task: TerraformInstaller@1
    displayName: 'Install Terraform CLI'
    inputs:
      terraformVersion: 'latest'

  # ---------------------------------------------------
  # Terraform Init
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      backendServiceArm: $(SERVICE_CONNECTION)
      backendAzureRmResourceGroupName: $(TF_RG)
      backendAzureRmStorageAccountName: $(TF_STA)
      backendAzureRmContainerName: $(TF_CONTAINER)
      backendAzureRmKey: $(TF_STATE_KEY)

  # ---------------------------------------------------
  # Terraform Format
  # ---------------------------------------------------
  - task: Bash@3
    displayName: 'Terraform Format'
    inputs:
      targetType: 'inline'
      script: |
        terraform -chdir=$(Build.SourcesDirectory)/infrastructure fmt -recursive -diff

  # ---------------------------------------------------
  # Terraform Validate
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Validate'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: $(Build.SourcesDirectory)/infrastructure
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

  # ---------------------------------------------------
  # Set Terraform Target Modules
  # ---------------------------------------------------
  - script: |
      TF_TARGETS=""

       # Add VNet & Subnet modules if selected
      if [ "${{ parameters.useVnet }}" = "True" ]; then
        TF_TARGETS="-target=module.vnet -target=module.subnet"
      fi

       # Add ACR module if selected
      if [ "${{ parameters.useACR }}" = "True" ]; then
        if [ -z "$TF_TARGETS" ]; then
          TF_TARGETS="-target=module.acr"
        else
          TF_TARGETS="$TF_TARGETS -target=module.acr"
        fi
      fi

      # Debug output
      if [ -z "$TF_TARGETS" ]; then
        echo "No modules selected, Terraform will run on all resources."
      else
        echo "Terraform targets: $TF_TARGETS"
      fi

      echo "##vso[task.setvariable variable=TF_TARGETS]$TF_TARGETS"
    displayName: 'Set Terraform Target Modules'

  # ---------------------------------------------------
  # Terraform Plan
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Plan'
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
      allowTelemetryCollection: false
      additionalArgs: '$(TF_TARGETS)'

  # ---------------------------------------------------
  # Terraform Apply
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Apply'
    condition: eq('${{ parameters.action }}', 'apply')
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
      allowTelemetryCollection: false
      commandOptions: '-auto-approve $(TF_TARGETS)'

  # ---------------------------------------------------
  # Terraform Destroy
  # ---------------------------------------------------
  - task: TerraformTaskV4@4
    displayName: 'Terraform Destroy'
    condition: eq('${{ parameters.action }}', 'destroy')
    inputs:
      provider: 'azurerm'
      command: 'destroy'
      workingDirectory: '$(Build.SourcesDirectory)/infrastructure'
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)
      allowTelemetryCollection: false
      commandOptions: '-auto-approve $(TF_TARGETS)'
