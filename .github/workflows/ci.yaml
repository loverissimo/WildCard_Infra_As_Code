name: WildCard Infra Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # ---- Azure Login ----
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---- Pulumi Setup ----
      - name: Setup Pulumi
        uses: pulumi/actions@v5

      - name: Select Pulumi Stack
        run: |
          pulumi stack select ${{ github.event.inputs.environment }} || pulumi stack init ${{ github.event.inputs.environment }}

      - name: Pulumi Install Dependencies
        run: npm install

      # ---- Preview ----
      - name: Pulumi Preview
        run: pulumi preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # ---- Infracost ----
      # - name: Infracost Setup
      #   uses: infracost/actions/setup@v3
      #   with:
      #     api-key: ${{ secrets.INFRACOST_API_KEY }}

      # - name: Generate cost estimate
      #   run: |
      #     infracost breakdown --path . --format table

  deploy:
    name: Manual Approval + Deploy
    runs-on: ubuntu-latest
    needs: preview
    environment: production-approval

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Pulumi
        uses: pulumi/actions@v5

      - name: Select Stack
        run: pulumi stack select ${{ github.event.inputs.environment }}

      - name: Pulumi Up (DEPLOY)
        run: pulumi up --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}